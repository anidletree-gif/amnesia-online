<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>失忆症 · 档案激活</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0c1210;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(180,150,110,0.07) 0%, transparent 45%),
                radial-gradient(ellipse at 80% 70%, rgba(120,160,140,0.05) 0%, transparent 40%),
                radial-gradient(circle at 30% 40%, rgba(180,150,110,0.05) 0%, transparent 40%);
            font-family: 'Source Code Pro', 'Courier New', monospace;
            color: #d4c9b8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn .5s ease;
        }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        .container {
            max-width: 420px;
            width: 100%;
        }
        .card {
            background: rgba(25, 30, 28, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(180, 150, 120, 0.15);
            border-radius: 4px 24px 4px 24px;
            padding: 30px 24px;
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.5), 0 0 40px rgba(180,150,110,0.06);
            animation: cardIn .55s ease both;
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo .icon {
            font-size: 48px;
            margin-bottom: 8px;
            opacity: 0.8;
        }
        .logo h1 {
            font-family: 'Playfair Display', 'Times New Roman', serif;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 2px;
            color: #d4c9b8;
        }
        .logo .subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            color: #a69b8a;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a69b8a;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(18, 22, 20, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(150, 120, 90, 0.25);
            border-radius: 0 20px 0 20px;
            color: #e3dbcd;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: #b89a7a;
            box-shadow: 0 0 0 2px rgba(180, 140, 100, 0.2);
            border-radius: 20px 0 20px 0;
        }
        .code-row {
            display: flex;
            gap: 10px;
        }
        .code-row input {
            flex: 1;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #2a2a24, #1a1a16);
            border: 1px solid #7a6a58;
            border-radius: 2px 16px 2px 16px;
            color: #d4c9b8;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0e0e0a;
            transition: all 0.1s;
            font-size: 14px;
            margin-top: 8px;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0e0e0a;
        }
        .btn.primary {
            background: linear-gradient(145deg, #5f7e6b, #3d5c4a);
            border-color: #8ECAE6;
        }
        .btn.small {
            width: auto;
            padding: 10px 16px;
            font-size: 12px;
            white-space: nowrap;
        }
        .toggle {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #a69b8a;
        }
        .toggle a {
            color: #b89a7a;
            cursor: pointer;
            text-decoration: none;
        }
        .toggle a:hover {
            color: #e3dbcd;
        }
        .error {
            color: #e06060;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .success {
            color: #8ECAE6;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        hr {
            border: none;
            border-top: 1px solid #7a6a58;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">
            <div class="icon">◈</div>
            <h1>失忆症</h1>
            <div class="subtitle">档案激活</div>
        </div>

        <!-- 注册表单 -->
        <form id="registerForm">
            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" id="regEmail" placeholder="example@qq.com" required>
            </div>
            <div class="form-group" id="codeGroup">
                <label>验证码</label>
                <div class="code-row">
                    <input type="text" id="regCode" placeholder="6位数字" maxlength="6" required>
                    <button type="button" class="btn small" onclick="sendCode()">发送验证码</button>
                </div>
                <div class="success" id="codeSuccess">验证码已发送，5分钟内有效</div>
                <div class="error" id="codeError"></div>
            </div>
            <div class="form-group">
                <label>昵称（唯一标识）</label>
                <input type="text" id="regNickname" placeholder="1-12位字符" maxlength="12" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="至少6位" required>
            </div>
            <button type="submit" class="btn primary">激活档案</button>
        </form>

        <hr>

        <!-- 登录表单 -->
        <form id="loginForm" style="display:none;">
            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" id="loginEmail" placeholder="example@qq.com" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码" required>
            </div>
            <button type="submit" class="btn primary">进入档案</button>
        </form>

        <div class="toggle">
            <span id="toggleText">已有档案？</span>
            <a id="toggleLink" onclick="toggleForm()">登录</a>
        </div>
        <div class="error" id="formError" style="text-align:center;"></div>
    </div>
</div>

<script>
    // ★ 自动感知服务器配置：OPEN_REGISTER=true 时隐藏验证码栏，false 时显示
    (async () => {
        try {
            const res = await fetch('/api/config');
            const cfg = await res.json();
            const codeGroup = document.getElementById('codeGroup');
            if (codeGroup) codeGroup.style.display = cfg.openRegister ? 'none' : '';
        } catch(e) { /* 配置获取失败时保持默认（显示验证码） */ }
    })();

    let isLogin = false;

    function toggleForm() {
        isLogin = !isLogin;
        document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
        document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
        document.getElementById('toggleText').textContent = isLogin ? '没有档案？' : '已有档案？';
        document.getElementById('toggleLink').textContent = isLogin ? '注册' : '登录';
        document.getElementById('formError').style.display = 'none';
    }

    async function sendCode() {
        const email = document.getElementById('regEmail').value.trim();
        const codeError = document.getElementById('codeError');
        const codeSuccess = document.getElementById('codeSuccess');
        codeError.style.display = 'none';
        codeSuccess.style.display = 'none';

        if (!email) {
            codeError.textContent = '请输入邮箱地址';
            codeError.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (res.ok) {
                codeSuccess.style.display = 'block';
            } else {
                codeError.textContent = data.error || '发送失败';
                codeError.style.display = 'block';
            }
        } catch(e) {
            codeError.textContent = '网络错误，请重试';
            codeError.style.display = 'block';
        }
    }

    // 注册
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formError = document.getElementById('formError');
        formError.style.display = 'none';

        const email = document.getElementById('regEmail').value.trim();
        const code = document.getElementById('regCode').value.trim();
        const nickname = document.getElementById('regNickname').value.trim();
        const password = document.getElementById('regPassword').value;

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, nickname, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('amnesia_user', JSON.stringify(data));
                location.href = '/';
            } else {
                formError.textContent = data.error || '注册失败';
                formError.style.display = 'block';
            }
        } catch(e) {
            formError.textContent = '网络错误，请重试';
            formError.style.display = 'block';
        }
    });

    // 登录
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formError = document.getElementById('formError');
        formError.style.display = 'none';

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('amnesia_user', JSON.stringify(data));
                location.href = '/';
            } else {
                formError.textContent = data.error || '登录失败';
                formError.style.display = 'block';
            }
        } catch(e) {
            formError.textContent = '网络错误，请重试';
            formError.style.display = 'block';
        }
    });
</script>
</body>
</html>
