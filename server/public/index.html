<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>失忆症Online · 记忆裂痕</title>
    <script src="vendor/tailwind.js"></script>
    <script>tailwind.config={theme:{extend:{colors:{'void':'#0c1210','memory':'#d4c9b8','fade':'#a69b8a','crack':'#8b7a6b','mist':'#e3dbcd'}}}}</script>
    <style>
    .player-volume-bar {
    height: 4px;
    background: #4caf50;
    width: 0%;
    margin: 2px 0;
    transition: width 0.1s, opacity 0.1s;
    opacity: 0;
}
.flip-card img {
    width: 100%;
    height: 70%;
    object-fit: contain;
    border-radius: 4px;
}
        @import url('vendor/fonts.css');
        *{font-family:'Source Code Pro','Courier New',monospace}h1,h2,h3,.serif{font-family:'Playfair Display','Times New Roman',serif;font-weight:500;letter-spacing:1px}
        body{background-color:#0c1210;background-image:radial-gradient(circle at 30% 40%,rgba(180,150,110,0.05) 0%,transparent 40%),repeating-linear-gradient(0deg,rgba(140,110,80,0.03) 0px,transparent 1px,transparent 40px)}
        .memory-card{background:rgba(25,30,28,0.7);backdrop-filter:blur(8px);border:1px solid rgba(180,150,120,0.15);box-shadow:0 15px 30px -10px rgba(0,0,0,0.5),0 0 0 1px rgba(210,180,140,0.05) inset;border-radius:4px 24px 4px 24px;transition:border-radius 0.2s,box-shadow 0.2s;padding:20px;margin-bottom:16px}
        .memory-card:hover{border-radius:24px 4px 24px 4px;box-shadow:0 20px 35px -8px rgba(0,0,0,0.6),0 0 0 1px rgba(200,170,130,0.15) inset}
        .memory-input{background:rgba(18,22,20,0.6);backdrop-filter:blur(4px);border:1px solid rgba(150,120,90,0.25);border-radius:0 20px 0 20px;color:#e3dbcd;padding:12px 20px;width:100%}
        .memory-input:focus{outline:none;border-color:#b89a7a;box-shadow:0 0 0 2px rgba(180,140,100,0.2);border-radius:20px 0 20px 0}
        .memory-btn{background:linear-gradient(145deg,#2a2a24,#1a1a16);border:1px solid #7a6a58;border-radius:2px 16px 2px 16px;color:#d4c9b8;box-shadow:0 4px 0 #0e0e0a,0 2px 6px rgba(0,0,0,0.3);font-weight:500;text-transform:uppercase;letter-spacing:1px;padding:10px 20px;cursor:pointer;width:100%}
        .memory-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0e0e0a;border-radius:16px 2px 16px 2px}
        .memory-btn:disabled{opacity:0.5;transform:none;box-shadow:0 2px 0 #0e0e0a;filter:grayscale(0.6)}
        .memory-btn-danger{background:linear-gradient(145deg,#4a2a2a,#2e1a1a);border-color:#a06060;color:#ecc0c0}
        .player-badge{background:rgba(30,28,26,0.7);backdrop-filter:blur(4px);border:1px dashed rgba(150,120,90,0.3);border-radius:2px 20px 2px 20px;padding:12px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.2);position:relative}
        .player-badge.dead{opacity:0.5;filter:grayscale(1);border-color:#604040}
        .player-badge.disconnected{border-color:#a07030;background:rgba(40,35,20,0.7)}
        .chat-log{background:rgba(12,15,13,0.5);backdrop-filter:blur(4px);border:1px solid rgba(140,110,80,0.15);border-radius:2px 24px 2px 24px;padding:14px;color:#c4b8a8;height:150px;overflow-y:auto}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#1a1a18}::-webkit-scrollbar-thumb{background:#7a6a58;border-radius:10px}
        .modal{display:none;position:fixed;z-index:1000;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);align-items:center;justify-content:center}
        .modal-content{max-width:500px;width:90%;max-height:70vh;overflow-y:auto;position:relative}
        .close{position:absolute;right:20px;top:15px;font-size:28px;cursor:pointer;color:#a69b8a}
        .avatar-img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #b89a7a;cursor:pointer}
        .kick-btn{position:absolute;top:-4px;right:-4px;background:#4a2a2a;border:1px solid #a06060;color:#ecc0c0;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .player-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid #b89a7a;margin-right:6px;vertical-align:middle}
        /* ===== 高级质感升级 ===== */
        #particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}
        /* 阶段氛围遮罩（夜晚/白天/投票） */
        #phaseOverlay{position:fixed;inset:0;z-index:2;pointer-events:none;transition:background 1.5s ease,box-shadow 1.5s ease}
        #phaseOverlay.night{background:radial-gradient(ellipse at 50% 30%,rgba(15,25,45,0.55) 0%,rgba(2,6,14,0.92) 100%);box-shadow:inset 0 0 180px rgba(5,15,50,0.9)}
        #phaseOverlay.day{background:radial-gradient(ellipse at 50% 20%,rgba(150,130,70,0.22) 0%,rgba(55,45,20,0.15) 100%)}
        #phaseOverlay.vote{background:radial-gradient(ellipse at 50% 40%,rgba(70,18,18,0.3) 0%,rgba(20,4,4,0.6) 100%);box-shadow:inset 0 0 160px rgba(90,8,8,0.5)}
        /* ★ 黑屏过场（阶段切换时光全黑，再淡入） */
        #fadeFlash{position:fixed;inset:0;z-index:90;background:#000;opacity:0;pointer-events:none;transition:opacity .8s ease}
        #fadeFlash.on{opacity:1}
        /* 顶部阶段胶囊 */
        #phaseIndicator{display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);border:1px solid rgba(180,150,120,.2);box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 12px rgba(180,150,110,.08) inset;letter-spacing:.5px;font-weight:500}
        #phaseIndicator .phase-dot{width:8px;height:8px;border-radius:50%;background:#7a6a58;box-shadow:0 0 8px rgba(255,200,120,.4)}
        #phaseIndicator.night .phase-dot{background:#5a8fe8;box-shadow:0 0 10px rgba(90,143,232,.8)}
        #phaseIndicator.day .phase-dot{background:#e8c46a;box-shadow:0 0 10px rgba(232,196,106,.9)}
        #phaseIndicator.vote .phase-dot{background:#e86a5a;box-shadow:0 0 10px rgba(232,106,90,.9)}
        #phaseIndicator .phase-bar{width:52px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
        #phaseIndicator .phase-bar i{display:block;height:100%;width:0%;border-radius:2px;transition:width .3s linear;background:linear-gradient(90deg,#7a6a58,#b89a7a)}
        #phaseIndicator.night .phase-bar i{background:linear-gradient(90deg,#3a5a9a,#5a8fe8)}
        #phaseIndicator.day .phase-bar i{background:linear-gradient(90deg,#a08040,#e8c46a)}
        #phaseIndicator.vote .phase-bar i{background:linear-gradient(90deg,#8a3a2a,#e86a5a)}
        /* 阶段切换大字提示 */
        #phaseBanner{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.92);z-index:80;font-family:'Playfair Display',serif;font-size:44px;letter-spacing:6px;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s,letter-spacing .6s;text-shadow:0 0 30px rgba(180,150,110,.4)}
        #phaseBanner.show{opacity:1;transform:translate(-50%,-50%) scale(1);letter-spacing:12px}
        #phaseBanner.sub{font-size:20px;letter-spacing:4px;color:#a69b8a;top:50%}
        /* 玩家面板 · 狼人杀式布局 */
        #playerList{display:flex;justify-content:space-between;gap:10px;padding:0 6px}
        #playerListCol{display:flex;flex-direction:column;gap:10px;flex:1;max-width:49%}
        .pw-card{position:relative;display:flex;align-items:center;gap:10px;background:rgba(24,29,27,.85);border:1px solid rgba(180,150,120,.18);border-radius:10px;padding:8px 10px;transition:border-color .25s,box-shadow .25s,transform .25s,opacity .4s;min-height:54px}
        .pw-card.speaking{border-color:rgba(232,190,90,.75);box-shadow:0 0 16px rgba(232,190,90,.35),0 0 0 1px rgba(232,190,90,.3) inset;transform:translateX(2px)}
        .pw-card.dead{opacity:.45;filter:grayscale(.9)}
        .pw-card.dead .pw-avatar{filter:grayscale(1) brightness(.6)}
        .pw-card.disconnected{opacity:.55;border-style:dashed;border-color:rgba(160,110,50,.5)}
        .pw-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(184,154,122,.6);flex-shrink:0;background:#2a2520}
        .pw-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
        .pw-name{font-size:13px;font-weight:600;color:#e3dbcd;white-space:nowrap;display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden}
        .pw-name .num{color:#b89a7a;font-size:11px;font-weight:500;flex-shrink:0}
        .pw-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .pw-name .crown{color:#e8c46a;font-size:11px;flex-shrink:0}
        .pw-name .me-tag{color:#5fae78;font-size:10px;flex-shrink:0;background:rgba(95,174,120,.15);border:1px solid rgba(95,174,120,.3);border-radius:4px;padding:0 3px}
        .pw-status{font-size:10px;color:#7d7466;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
        .pw-status .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
        .pw-status .dot.alive{background:#6fae78;box-shadow:0 0 6px rgba(111,174,120,.7)}
        .pw-status .dot.dead{background:#c05050;box-shadow:0 0 6px rgba(192,80,80,.7)}
        .pw-status .dot.off{background:#a07030}
        .pw-volume{position:absolute;bottom:4px;left:56px;right:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
        .pw-volume i{display:block;height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#7a6a58,#d4a05c);transition:width .1s;opacity:0}
        .pw-dead-x{position:absolute;top:4px;right:6px;font-size:12px;color:rgba(220,90,90,.85)}
        .pw-kick{position:absolute;top:-8px;right:-8px;background:#4a2a2a;border:1px solid #a06060;color:#ecc0c0;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
        /* ===== 公示容器（投票结果/白天死者/游戏结束统一展示） ===== */
        #announceOverlay{position:fixed;inset:0;z-index:10006;background:radial-gradient(ellipse at 50% 50%, rgba(6,10,14,.92), rgba(1,2,4,.97));display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s}
        #announceOverlay.show{opacity:1;pointer-events:auto}
        .ann-card{max-width:560px;width:90%;background:linear-gradient(160deg,#1a1712,#0e0c09);border:1px solid rgba(200,170,120,.35);border-radius:14px 40px 14px 40px;padding:30px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7), inset 0 0 60px rgba(180,140,80,.05);transform:translateY(20px) scale(.94);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
        #announceOverlay.show .ann-card{transform:none}
        .ann-icon{font-size:52px;margin-bottom:8px}
        .ann-title{font-family:'Playfair Display',serif;font-size:30px;letter-spacing:4px;color:#ffd97a;text-shadow:0 0 24px rgba(255,217,122,.45);margin-bottom:6px}
        .ann-title.dead{color:#e8a0a0;text-shadow:0 0 24px rgba(232,120,120,.4)}
        .ann-title.win{color:#9fd8a8;text-shadow:0 0 24px rgba(130,220,150,.45)}
        .ann-sub{font-size:13px;color:#a6987f;letter-spacing:2px;margin-bottom:14px}
        .ann-body{font-size:13px;color:#cbbfa8;line-height:2;letter-spacing:.5px}
        .ann-tally{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
        .ann-tally span{background:rgba(255,217,122,.08);border:1px solid rgba(255,217,122,.25);border-radius:6px;padding:3px 12px;font-size:13px;color:#e8d9b8}
        .ann-list{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
        .ann-list span{background:rgba(150,140,120,.1);border:1px solid rgba(180,160,130,.25);border-radius:6px;padding:4px 10px;font-size:12px;color:#d8cdb8}
        .ann-list span.dead{background:rgba(192,80,80,.12);border-color:rgba(192,80,80,.35);color:#e0a0a0}
        .ann-close{margin-top:18px;padding:10px 44px;background:linear-gradient(150deg,#3a2e1e,#22190e);border:1px solid #b89a7a;color:#e8d9b8;border-radius:8px;font-size:14px;letter-spacing:3px;cursor:pointer;transition:all .2s}
        .ann-close:hover{background:linear-gradient(150deg,#4a3a26,#2a1f12);box-shadow:0 0 16px rgba(184,154,122,.35)}
        /* 阶段小徽章（房间码旁） */
        .phase-badge{margin-left:12px;font-size:12px;padding:4px 12px;border-radius:999px;background:rgba(10,14,16,.6);border:1px solid rgba(180,150,120,.25);color:#d4c9b8;letter-spacing:1px;font-family:'Source Code Pro',monospace;display:none;align-items:center;gap:4px;white-space:nowrap}
        .phase-badge.night{display:inline-flex;border-color:rgba(90,143,232,.5);color:#a9c2ff;box-shadow:0 0 10px rgba(60,100,210,.25)}
        .phase-badge.day{display:inline-flex;border-color:rgba(232,196,106,.5);color:#ffe9b0;box-shadow:0 0 10px rgba(220,170,70,.25)}
        .phase-badge.vote{display:inline-flex;border-color:rgba(232,106,90,.5);color:#ffc9c0;box-shadow:0 0 10px rgba(210,70,55,.25)}
        /* 内联行动按钮 */
        .pw-action-area{display:flex;flex-direction:column;gap:6px;padding:6px 8px;background:rgba(15,20,18,.85);border:1px solid rgba(180,150,120,.15);border-radius:8px;margin-bottom:4px}
        .pw-act-btn{background:rgba(35,35,30,.9);border:1px solid rgba(150,120,90,.4);color:#d4c9b8;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;transition:all .15s}
        .pw-act-btn:hover{border-color:#b89a7a;color:#efe6d8}
        /* ===== 3D 行动桌（翻牌选择） ===== */
        #flipTableOverlay{position:fixed;inset:0;z-index:10000;background:radial-gradient(ellipse at 50% 55%, rgba(8,14,20,.94), rgba(1,3,6,.98));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;opacity:0;transition:opacity .35s}
        #flipTableOverlay.show{opacity:1}
        #flipTableOverlay .ft-desc{color:#c9b088;font-size:15px;letter-spacing:1px;text-shadow:0 0 12px rgba(200,170,120,.3);font-family:'Playfair Display',serif}
        .flip-table{perspective:1400px;width:min(680px,94vw);min-height:340px;background:linear-gradient(165deg,#332a1e 0%,#1d1710 55%,#14100a 100%);border:1px solid rgba(210,180,140,.2);border-radius:26px;box-shadow:inset 0 0 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,230,180,.06),0 24px 70px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:36px 24px;position:relative;transform:translateY(46px) scale(.86);opacity:0;transition:transform .55s cubic-bezier(.18,.9,.22,1.18),opacity .45s}
        .flip-table.show{transform:translateY(0) scale(1);opacity:1}
        /* ★ 修复：overlay 显示时桌子自动显现（JS 只控制 overlay） */
        #flipTableOverlay.show .flip-table{transform:translateY(0) scale(1);opacity:1}
        #flipTableOverlay.show .ft-card{animation-play-state:running}
        .flip-table::before{content:'◈';position:absolute;top:14px;left:50%;transform:translateX(-50%);color:rgba(200,170,130,.18);font-size:18px;letter-spacing:6px}
        .flip-table::after{content:'';position:absolute;inset:10px;border:1px dashed rgba(190,160,120,.14);border-radius:18px;pointer-events:none}
        .ft-cards{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;perspective:1200px}
        .ft-card{width:120px;height:172px;position:relative;transform-style:preserve-3d;cursor:pointer;margin:10px 9px;animation:ftFlyIn .65s cubic-bezier(.16,.9,.24,1.16) both}
        .ft-card[data-idx="0"]{animation-delay:.15s}
        .ft-card[data-idx="1"]{animation-delay:.3s}
        .ft-card[data-idx="2"]{animation-delay:.45s}
        .ft-card[data-idx="3"]{animation-delay:.6s}
        @keyframes ftFlyIn{0%{transform:translateY(240px) rotateX(60deg) rotateZ(calc((var(--fan,0))*1deg)) scale(.6);opacity:0}100%{transform:translateY(0) rotateX(0) rotateZ(var(--fan,0)) scale(1);opacity:1}}
        .ft-card .ft-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.85,.3,1.15)}
        .ft-card.flipped .ft-inner{transform:rotateY(180deg)}
        .ft-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(215,185,145,.3);box-shadow:0 10px 30px rgba(0,0,0,.55);background:linear-gradient(155deg,#3b3226,#221b12)}
        .ft-back{transform:rotateY(180deg);background:linear-gradient(155deg,#4a3f2e,#241d12);border:1px solid rgba(215,185,145,.22)}
        .ft-back .ft-back-pattern{width:52px;height:52px;border:2px solid rgba(215,185,145,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(215,185,145,.6)}
        .ft-card .ft-name{font-size:12px;color:#e8dcc4;letter-spacing:.5px}
        .ft-card.up{transform:translateY(-20px)}
        .ft-card.up .ft-front{border-color:#e8c46a;box-shadow:0 0 34px rgba(232,196,106,.55),0 16px 36px rgba(0,0,0,.6)}
        .ft-card .ft-sub{font-size:10px;color:#a6997e}
        #flipTableOverlay .ft-confirm{margin-top:6px;padding:12px 46px;background:linear-gradient(150deg,#3a4a3c,#223026);border:1px solid #6fae78;color:#d8f0dc;border-radius:10px;font-size:15px;letter-spacing:2px;cursor:pointer;opacity:0;transform:translateY(14px);transition:opacity .3s,transform .3s;box-shadow:0 6px 18px rgba(0,0,0,.4)}
        #flipTableOverlay .ft-confirm.show{opacity:1;transform:none}
        #flipTableOverlay .ft-confirm:hover{background:linear-gradient(150deg,#4a5c4c,#2c3c30);box-shadow:0 0 24px rgba(111,174,120,.4)}
        #flipTableOverlay .ft-cancel{position:absolute;top:18px;right:22px;color:#8a7a66;font-size:22px;cursor:pointer;background:none;border:none;transition:color .2s;z-index:5}
        #flipTableOverlay .ft-cancel:hover{color:#ecc0c0}
        /* ===== 3D 投票桌（号码牌立桌边） ===== */
        #voteTableOverlay{position:fixed;inset:0;z-index:10000;background:radial-gradient(ellipse at 50% 55%, rgba(8,14,20,.95), rgba(1,3,6,.99));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;opacity:0;transition:opacity .4s}
        #voteTableOverlay.show{opacity:1}
        #voteTableOverlay .vt-title{color:#c9b088;font-size:17px;letter-spacing:2px;font-family:'Playfair Display',serif;text-shadow:0 0 14px rgba(200,170,120,.35)}
        #voteTableOverlay .vt-hint{color:#8a7a66;font-size:12px;letter-spacing:1px}
        .vote-stage{perspective:1200px;width:min(760px,95vw);height:min(420px,50vh);position:relative;transform:translateY(40px) scale(.92);opacity:0;transition:transform .6s cubic-bezier(.16,.9,.22,1.15),opacity .5s}
        #voteTableOverlay.show .vote-stage{transform:translateY(0) scale(1);opacity:1}
        .vt-table{position:absolute;left:50%;top:50%;width:min(720px,92vw);height:min(380px,46vh);transform:translate(-50%,-50%) rotateX(58deg);background:radial-gradient(ellipse at 50% 38%, #4a3c28 0%, #332818 45%, #201809 100%);border-radius:50%;border:1px solid rgba(220,185,140,.25);box-shadow:inset 0 0 90px rgba(0,0,0,.7), 0 20px 60px rgba(0,0,0,.8), inset 0 -2px 0 rgba(255,220,170,.06);overflow:hidden}
        .vt-table::before{content:'';position:absolute;left:50%;top:50%;width:70%;height:70%;transform:translate(-50%,-50%);border:1px dashed rgba(210,180,130,.16);border-radius:50%}
        .vt-table::after{content:'◈';position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);color:rgba(210,180,130,.15);font-size:34px}
        .vt-table .vt-wood{position:absolute;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg, transparent 0 40px, rgba(0,0,0,.14) 40px 44px);top:50%;transform:translateY(-50%) rotate(-8deg)}
        /* 号码牌：环绕桌面摆放 */
        .vt-plaques{position:absolute;inset:0;perspective:900px}
        .vt-plaque{position:absolute;left:50%;top:50%;width:112px;height:146px;transform:translate(-50%,-50%) rotateX(0deg) rotateZ(var(--ang,0deg)) translateY(-212px) rotateZ(calc(var(--ang,0deg)*-1)) rotateX(0deg);transform-style:preserve-3d;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.3,1.2),filter .3s}
        .vt-plaque .plaque-body{position:absolute;inset:0;border-radius:12px;background:linear-gradient(160deg,#4a3c2a,#241c10);border:1px solid rgba(215,185,145,.35);box-shadow:0 14px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color .25s,box-shadow .25s,background .25s;transform:translateZ(10px)}
        .vt-plaque img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(215,185,145,.45)}
        .vt-plaque .pl-num{font-size:26px;font-weight:700;color:#e8dcc4;font-family:'Playfair Display',serif;text-shadow:0 0 12px rgba(232,220,196,.3)}
        .vt-plaque .pl-name{font-size:11px;color:#b0a18a;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
        .vt-plaque .pl-badge{font-size:10px;color:#8a9a8a;letter-spacing:1px}
        /* 选中：金色光边 + 上浮 */
        .vt-plaque.sel .plaque-body{border-color:#ffd97a;box-shadow:0 0 30px rgba(255,217,122,.6),0 0 0 2px rgba(255,217,122,.35) inset,0 16px 36px rgba(0,0,0,.6);background:linear-gradient(160deg,#5a4a30,#2e2414)}
        .vt-plaque.sel{transform:translate(-50%,-50%) rotateX(0deg) rotateZ(var(--ang,0deg)) translateY(-238px) rotateZ(calc(var(--ang,0deg)*-1)) rotateX(0deg) scale(1.08)}
        .vt-plaque.voted .plaque-body{border-color:#5fae78;box-shadow:0 0 20px rgba(95,174,120,.35);background:linear-gradient(160deg,#2e3a30,#1c241e)}
        .vt-plaque.voted .pl-badge{color:#7fb88a}
        /* 已投/等待态 */
        .vt-plaque.other-voted{opacity:.6}
        .vt-plaque.other-voted .plaque-body{border-color:rgba(95,174,120,.5)}
        /* 弃权牌 */
        .vt-plaque.abstain{width:112px;height:146px}
        .vt-plaque.abstain .plaque-body{background:linear-gradient(160deg,#3a2a22,#1c120e)}
        .vt-plaque.abstain .pl-badge{color:#c08070}
        /* 被处决：清下桌动画 */
        .vt-plaque.removed{animation:plaqueRemove 1.2s cubic-bezier(.55,-0.2,.8,.6) forwards}
        @keyframes plaqueRemove{0%{transform:translate(-50%,-50%) rotateX(0) rotateZ(var(--ang,0deg)) translateY(-212px) rotateZ(calc(var(--ang,0deg)*-1)) scale(1);opacity:1}30%{transform:translate(-50%,-50%) rotateX(0) rotateZ(var(--ang,0deg)) translateY(-200px) rotateZ(calc(var(--ang,0deg)*-1)) scale(1.06);opacity:1}100%{transform:translate(-50%,-40%) rotateX(-82deg) rotateZ(var(--ang,0deg)) translateY(-40px) rotateZ(calc(var(--ang,0deg)*-1)) scale(.9);opacity:0}}
        /* 结果横幅 */
        .vt-result{position:fixed;top:18%;left:50%;transform:translate(-50%,-30%) scale(.85);z-index:10005;text-align:center;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
        .vt-result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
        .vt-result .vr-main{font-family:'Playfair Display',serif;font-size:42px;letter-spacing:4px;color:#ffd97a;text-shadow:0 0 30px rgba(255,217,122,.5)}
        .vt-result .vr-sub{font-size:14px;color:#b0a18a;letter-spacing:2px;margin-top:8px}
        .vt-result .vr-tally{font-size:12px;color:#8a7a66;margin-top:6px;letter-spacing:1px}
        #voteTableOverlay .vt-confirm{margin-top:4px;padding:12px 46px;background:linear-gradient(150deg,#3a4a3c,#223026);border:1px solid #6fae78;color:#d8f0dc;border-radius:10px;font-size:15px;letter-spacing:2px;cursor:pointer;opacity:0;transform:translateY(14px);transition:opacity .3s,transform .3s;box-shadow:0 6px 18px rgba(0,0,0,.4)}
        #voteTableOverlay .vt-confirm.show{opacity:1;transform:none}
        #voteTableOverlay .vt-confirm:hover{background:linear-gradient(150deg,#4a5c4c,#2c3c30);box-shadow:0 0 24px rgba(111,174,120,.4)}
        #voteTableOverlay .vt-cancel{position:absolute;top:18px;right:22px;color:#8a7a66;font-size:24px;cursor:pointer;background:none;border:none;z-index:10006;transition:color .2s}
        #voteTableOverlay .vt-cancel:hover{color:#ecc0c0}
        .memory-card{transition:border-radius .25s,box-shadow .25s,transform .25s,border-color .25s}
        .memory-card:hover{transform:translateY(-2px);border-color:rgba(200,175,140,.25)}
        .memory-btn{position:relative;overflow:hidden}
        .memory-btn::after{content:'';position:absolute;top:0;left:-150%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,235,200,.16),transparent);transform:skewX(-20deg);transition:left .5s;pointer-events:none}
        .memory-btn:hover::after{left:150%}
        .memory-btn:hover{box-shadow:0 4px 0 #0e0e0a,0 0 20px rgba(200,170,130,.28);border-color:#b89a7a;color:#efe6d8;text-shadow:0 0 8px rgba(200,170,130,.5)}
        .memory-btn:disabled:hover{box-shadow:0 2px 0 #0e0e0a;text-shadow:none}
        .title-grad{background:linear-gradient(180deg,#f2ead9 20%,#c9ab7d 60%,#8f7a5c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(200,170,130,.18))}
        .modal{animation:modalIn .25s ease}
        @keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
        #app>*{animation:fadeUp .6s ease both}
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        #loginPanel{animation-delay:.05s}
        #gamePanel{animation-delay:.05s}
        .memory-card .close:hover{color:#efe6d8;text-shadow:0 0 10px rgba(200,170,130,.6)}
        #userBar img{transition:box-shadow .2s,transform .2s}
        #userBar img:hover{box-shadow:0 0 0 2px rgba(200,170,130,.5);transform:scale(1.05)}
    </style>
</head>

<script>
// ===== 记忆碎屑粒子背景 =====
(function(){
    var c=document.getElementById('particleCanvas');if(!c)return;
    var ctx=c.getContext('2d');var W,H,ps=[];
    function rs(){W=c.width=innerWidth;H=c.height=innerHeight;var n=Math.min(90,Math.floor(W*H/16000));
        ps=[];for(var i=0;i<n;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.4,s:Math.random()*0.5+0.12,a:Math.random()*0.5+0.12,tw:Math.random()*6.28});
    }
    rs();addEventListener('resize',rs);
    var hue=35;
    (function loop(){
        ctx.clearRect(0,0,W,H);
        for(var i=0;i<ps.length;i++){var p=ps[i];
            p.y-=p.s;p.tw+=0.02;p.x+=Math.sin(p.tw)*0.35;
            if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
            var alpha=p.a*(0.6+0.4*Math.sin(p.tw));
            ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);
            ctx.fillStyle='hsla('+hue+',45%,72%,'+alpha+')';ctx.fill();
            if(p.r>1.4){ctx.shadowBlur=8;ctx.shadowColor='hsla('+hue+',45%,70%,.5)';
                ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();ctx.shadowBlur=0}
        }
        requestAnimationFrame(loop);
    })();
})();
</script>
